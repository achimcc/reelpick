[package]
name = "reelpick"
version = "0.1.1"
edition = "2024"
license = "AGPL-3.0-only"
description = "One film a day from your Jellyfin library, chosen and described by a local model"
repository = "https://github.com/achimcc/reelpick"

[dependencies]
ammonia = "4"
anyhow = "1"
axum = "0.8"
comrak = "0.54"
jiff = "0.2"
maud = { version = "0.27", features = ["axum"] }
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs"] }
toml = "1"
tower-http = { version = "0.6", features = ["set-header"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"
